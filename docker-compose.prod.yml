# NOFX Production Deployment
# Uses prebuilt images (latest tag), suitable for server deployment.

services:
  nofx:
    image: ghcr.io/lhylyq31/newmoneyclub/backend:latest
    container_name: newmoneyclub-backend
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ${NOFX_DB_BACKUP_HOST_DIR:-./backups}:/app/backups
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      TZ: ${NOFX_TIMEZONE:-Asia/Shanghai}
      API_SERVER_PORT: 8080
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-8000}
      TRANSPORT_ENCRYPTION: ${TRANSPORT_ENCRYPTION:-false}
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_PATH: ${DB_PATH:-data/data.db}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_BACKUP_ENABLED: ${DB_BACKUP_ENABLED:-true}
      DB_BACKUP_INTERVAL_MINUTES: ${DB_BACKUP_INTERVAL_MINUTES:-60}
      DB_BACKUP_DIR: ${DB_BACKUP_DIR:-/app/backups}
      DB_BACKUP_RETENTION_DAYS: ${DB_BACKUP_RETENTION_DAYS:-7}
      DB_BACKUP_ON_STARTUP: ${DB_BACKUP_ON_STARTUP:-true}
      NOFX_SUPER_ADMIN_EMAIL: ${NOFX_SUPER_ADMIN_EMAIL:-admin@example.com}
      NOFX_SUPER_ADMIN_PASSWORD: ${NOFX_SUPER_ADMIN_PASSWORD:-Admin@123456}
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  nofx-frontend:
    image: ghcr.io/lhylyq31/newmoneyclub/frontend:latest
    container_name: newmoneyclub-frontend
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-3000}:80"
    networks:
      - nofx-network
    depends_on:
      nofx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  nofx-network:
    driver: bridge
